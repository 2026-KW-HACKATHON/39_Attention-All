name: Mobile verification
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'backend/client/**', 'backend/functions/src/workouts.js', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'backend/client/**', 'backend/functions/src/workouts.js', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
