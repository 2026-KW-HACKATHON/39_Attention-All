<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우이런 운영</title><style>body{font:16px system-ui;background:#f5f6f3;color:#18261d;max-width:920px;margin:40px auto;padding:20px}section{background:white;padding:24px;margin:20px 0;border:1px solid #ddd;border-radius:16px}button,input,textarea,select{font:inherit;padding:12px;border:1px solid #bbb;border-radius:8px}button{cursor:pointer;background:#e2eddf}form{display:grid;gap:12px}label{display:grid;gap:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:280px}canvas{display:block;width:100%;max-width:700px;touch-action:none;border:1px solid #ddd}figure{margin:16px 0;padding:12px;background:#f5f6f3}#status{white-space:pre-wrap}h2{font-size:20px}</style>
<h1>우이런 운영</h1><button id="login">Google 로그인</button> <button id="local-login" hidden>로컬 검증 관리자 로그인</button> <button id="logout">로그아웃</button><p id="status">관리자 계정으로 로그인해주세요.</p><main id="admin" hidden>
<section><h2>현장 제보 검토</h2><button id="reload">새로고침</button><button id="load-issue">입력한 제보 검토 불러오기</button><div id="queue"></div><form id="review"><label>제보 ID<input name="issueId" required></label><label>처리<select name="decision"><option>APPROVE</option><option>REJECT</option><option>HIDE</option></select></label><button>선택한 처리 적용</button></form><pre id="detail"></pre><div id="photos"></div></section>
<section><h2>우이천 소식</h2><form id="news"><label>ID<input name="id" required maxlength="80"></label><label>제목<input name="title" required maxlength="160"></label><label>본문<textarea name="body" required maxlength="10000"></textarea></label><label>출처 링크<input name="sourceUrl" type="url"></label><label>주제<select name="topic"><option value="">기존 값 유지</option><option value="eco">생태·하천 정보</option><option value="proposal">개선 제안</option><option value="plan">사업 계획</option></select></label><label>자료상 상태<input name="status" maxlength="80" placeholder="제안 · 검토 답변"></label><label>출처 유형<select name="kind"><option value="">기존 값 유지</option><option value="official">공식 자료</option><option value="council">회의록</option><option value="press">언론 보도</option><option value="citizen">시민기자</option></select></label><label>출처명<input name="source" maxlength="160"></label><label>원자료 발행·수정·회의 날짜<input name="pub" type="date"></label><label><input name="clearPub" type="checkbox">발행일 미상으로 저장</label><label>날짜 종류<input name="pubKind" maxlength="40" placeholder="기사 발행 / 페이지 수정 / 회의일"></label><label>팀이 확인한 날짜<input name="checked" type="date"></label><label><input name="clearChecked" type="checkbox">기존 팀 확인일 지우기</label><p>비운 선택 항목은 기존 값을 유지합니다. 날짜를 삭제하려면 위 항목을 선택하세요.</p><label>사건/행사 설명<input name="event" maxlength="200"></label><label>짧은 요약<textarea name="summary" maxlength="2000"></textarea></label><button>초안 저장</button></form><form id="publish"><label>소식 ID<input name="id" required></label><label>공개 여부<select name="published"><option value="true">공개</option><option value="false">비공개</option></select></label><button>공개 상태 변경</button></form></section>
<section><h2>웰컴 혜택 승인</h2><pre id="welcome-list"></pre><form id="welcome"><label>사용자 UID<input name="userId" required></label><button>참여 이력 확인 후 승인</button></form></section>
<section><h2>혜택 제휴처 설정</h2><p>실제 제휴가 확정된 경우에만 등록하세요. 재고를 다시 저장하면 해당 수량으로 변경됩니다.</p><form id="merchant"><label>제휴처 ID<input name="id" required></label><label>상호<input name="name" required></label><label>확인 PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" required maxlength="6" autocomplete="new-password"></label><label>혜택명<input name="title" required></label><label>사용 조건<input name="condition" required></label><label>재고<input name="stock" type="number" min="0" max="100000" required></label><label>유효 일수<input name="validDays" type="number" min="1" max="365" value="30" required></label><button>등록</button></form></section>
<section><h2>코스·시설·경로 설정</h2><p>실측 경로를 확보한 뒤 JSON으로 갱신하세요. 현재 경로는 시안 근사 경로입니다.</p><form id="pilot"><label>configurePilot 요청 JSON<textarea name="json" rows="12" required></textarea></label><button>설정 적용</button></form></section></main><script type="module" src="./admin.mjs"></script></html>
