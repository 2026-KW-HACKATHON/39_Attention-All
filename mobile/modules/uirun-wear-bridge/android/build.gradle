// 우이런 워치(Wear OS) 연결 네이티브 모듈. mobile/modules 아래 로컬 Expo 모듈이라 prebuild로 android/를 다시 만들어도 유지된다.
// 서비스 선언·capability 리소스는 이 모듈의 AndroidManifest·res에 있고 앱 매니페스트에 합쳐진다(android/를 손으로 고치지 않는다).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.attentionall.uirun'
version = '0.1.0'

android {
  namespace "com.attentionall.uirun.wearbridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // 워치 앱(watch/app/build.gradle.kts)과 같은 버전
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}
